<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
      fill: url(#primary-grad);
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
    }
    
    /* Dynamic Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes driftCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes driftCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes sprintProgress {
      0% { width: 40px; }
      50% { width: 140px; }
      100% { width: 40px; }
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -40; }
    }

    .ambient-glow-1 {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: 220px 90px;
    }
    .ambient-glow-2 {
      animation: pulseGlow 10s ease-in-out infinite reverse;
      transform-origin: 1020px 240px;
    }
    .floating-card-1 {
      animation: driftCard1 6s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: driftCard2 7s ease-in-out infinite;
    }
    .progress-bar-active {
      animation: sprintProgress 5s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 6 6;
      animation: flowDash 3s linear infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Ambient Animated Glow Spheres (Background only, won't obscure text) -->
  <circle class="ambient-glow-1" cx="220" cy="90" r="130" fill="#3b82f6" filter="url(#glow)" />
  <circle class="ambient-glow-2" cx="1020" cy="240" r="140" fill="#8b5cf6" filter="url(#glow)" />

  <!-- Subtle Agile Flow Grid Lines (Background decoration) -->
  <path class="stream-line" d="M 50 180 Q 300 240, 600 180 T 1150 180" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.3" />
  <path class="stream-line" d="M 50 220 Q 350 140, 650 210 T 1150 200" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.25" />

  <!-- Dynamic Kanban Visual Cards (Right Section) -->
  <g class="floating-card-1" transform="translate(860, 45)">
    <rect width="280" height="120" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4"/>
    <rect x="18" y="18" width="85" height="20" rx="6" fill="#0369a1" fill-opacity="0.5"/>
    <text x="26" y="32" class="badge-text" fill="#38bdf8">IN PROGRESS</text>
    <circle cx="248" cy="28" r="6" fill="#10b981" />
    
    <text x="18" y="62" font-family="-apple-system, sans-serif" font-weight="600" font-size="14" fill="#f1f5f9">Sprint 24: Issue Triage</text>
    <rect x="18" y="78" width="244" height="6" rx="3" fill="#334155"/>
    <rect class="progress-bar-active" x="18" y="78" width="120" height="6" rx="3" fill="url(#primary-grad)"/>
    <text x="18" y="102" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">8 of 12 Tasks Closed</text>
  </g>

  <g class="floating-card-2" transform="translate(890, 190)">
    <rect width="250" height="110" rx="12" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4"/>
    <rect x="18" y="16" width="65" height="20" rx="6" fill="#4338ca" fill-opacity="0.5"/>
    <text x="26" y="30" class="badge-text" fill="#a5b4fc">BACKLOG</text>
    
    <text x="18" y="58" font-family="-apple-system, sans-serif" font-weight="600" font-size="14" fill="#f1f5f9">Roadmap Milestone 2.0</text>
    <text x="18" y="80" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Linear / Jira / Plane Sync</text>
    <circle cx="220" cy="78" r="10" fill="#334155"/>
    <text x="214" y="82" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">AI</text>
  </g>

  <!-- Title and Header Text (Always in clear foreground) -->
  <g transform="translate(70, 95)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="270" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#38bdf8"/>
    <text x="30" y="20" class="badge-text" fill="#cbd5e1">AGILE &amp; ISSUE TRACKING ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="75" class="title-text">Awesome Project Management</text>
    <text x="0" y="125" class="title-text" fill="#f8fafc">&amp; Issue Tracking</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="168" class="subtitle-text">Curated SaaS platforms, self-hosted alternatives, Kanban engines &amp; sprint planners</text>

    <!-- Highlights Icons / Pills -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="125" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="18" class="badge-text" fill="#38bdf8">⚡ Agile &amp; Scrum</text>

      <rect x="135" y="0" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="149" y="18" class="badge-text" fill="#818cf8">📋 Kanban Boards</text>

      <rect x="275" y="0" width="135" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="289" y="18" class="badge-text" fill="#34d399">🚀 100% Open Source</text>

      <rect x="420" y="0" width="115" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="434" y="18" class="badge-text" fill="#f472b6">🏢 Top SaaS</text>
    </g>
  </g>
</svg>
